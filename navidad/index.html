<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo de la cena de Navidad</title>
<!-- El bingo de Navidad ahora es un juego más dentro de la app principal.
     Esta página solo redirige, conservando la partida si venías de un enlace compartido. -->
<script>
(function(){
  var p=new URLSearchParams(location.hash.slice(1));
  p.set('m','navidad');
  location.replace('../#'+p.toString());
})();
</script>
<meta http-equiv="refresh" content="0; url=../#m=navidad">
</head>
<body style="background:#0f2e23;color:#f6efe0;font:16px system-ui;text-align:center;padding:40px">
<p>El bingo de Navidad se ha mudado. <a href="../#m=navidad" style="color:#d9ac4f">Ir al bingo</a></p>
</body>
</html>
