<!-- Pantalla inicial: elegir juego -->
<section id="picker" aria-labelledby="pickT">
 <header class="phead">
  <p class="kicker">Bingo para jugar con los tuyos</p>
  <h1 id="pickT">¿A qué jugamos?</h1>
  <p class="sub">Elige dónde estáis y te damos un cartón con cosas que pueden pasar allí.</p>
 </header>
 <div class="tiles" id="tiles"></div>
</section>

<!-- El juego -->
<div id="game" hidden>
 <div class="deco" aria-hidden="true">
  <svg class="d-calle" viewBox="0 0 400 56" preserveAspectRatio="none">
   <g fill="var(--bg2)">
    <rect x="0" y="22" width="44" height="34"/><rect x="48" y="8" width="30" height="48"/><rect x="82" y="28" width="52" height="28"/>
    <rect x="138" y="14" width="36" height="42"/><rect x="178" y="30" width="28" height="26"/><rect x="210" y="4" width="40" height="52"/>
    <rect x="254" y="24" width="50" height="32"/><rect x="308" y="12" width="34" height="44"/><rect x="346" y="26" width="54" height="30"/>
   </g>
   <g fill="#ffd23f" opacity=".85">
    <rect x="54" y="16" width="6" height="6"/><rect x="66" y="28" width="6" height="6"/><rect x="146" y="22" width="6" height="6"/>
    <rect x="218" y="12" width="6" height="6"/><rect x="236" y="26" width="6" height="6"/><rect x="316" y="20" width="6" height="6"/>
    <rect x="96" y="36" width="6" height="6"/><rect x="268" y="32" width="6" height="6"/><rect x="360" y="34" width="6" height="6"/>
   </g>
  </svg>
  <svg class="d-navidad" viewBox="0 0 400 40" preserveAspectRatio="none">
   <path d="M-4 6 Q 30 30 66 8 T 136 8 T 206 8 T 276 8 T 346 8 T 416 8" fill="none" stroke="#06170f" stroke-width="2"/>
   <g class="bulbs">
    <ellipse cx="18" cy="21" rx="5" ry="7" fill="#e5484d"/><ellipse cx="50" cy="20" rx="5" ry="7" fill="#f5c542"/>
    <ellipse cx="88" cy="21" rx="5" ry="7" fill="#46b17b"/><ellipse cx="120" cy="20" rx="5" ry="7" fill="#e5484d"/>
    <ellipse cx="158" cy="21" rx="5" ry="7" fill="#f5c542"/><ellipse cx="190" cy="20" rx="5" ry="7" fill="#46b17b"/>
    <ellipse cx="228" cy="21" rx="5" ry="7" fill="#e5484d"/><ellipse cx="260" cy="20" rx="5" ry="7" fill="#f5c542"/>
    <ellipse cx="298" cy="21" rx="5" ry="7" fill="#46b17b"/><ellipse cx="330" cy="20" rx="5" ry="7" fill="#e5484d"/>
    <ellipse cx="368" cy="21" rx="5" ry="7" fill="#f5c542"/><ellipse cx="396" cy="20" rx="5" ry="7" fill="#46b17b"/>
   </g>
  </svg>
  <svg class="d-coche" viewBox="0 0 400 30" preserveAspectRatio="none">
   <rect width="400" height="30" fill="#14181f"/>
   <path class="lane" d="M0 15h400" stroke="#f5c400" stroke-width="3" stroke-dasharray="22 16"/>
  </svg>
  <svg class="d-playa" viewBox="0 0 400 40" preserveAspectRatio="none">
   <path class="wave" d="M0 22 Q25 10 50 22 T100 22 T150 22 T200 22 T250 22 T300 22 T350 22 T400 22 T450 22 V40 H0z" fill="rgba(255,255,255,.25)"/>
   <path d="M0 28 Q25 18 50 28 T100 28 T150 28 T200 28 T250 28 T300 28 T350 28 T400 28 V40 H0z" fill="rgba(255,255,255,.18)"/>
  </svg>
 </div>

 <header class="ghead">
  <button class="back" id="back" aria-label="Cambiar de juego">← Juegos</button>
  <p class="kicker" id="kicker"></p>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
 </header>

 <main>
  <div class="bar">
   <div class="seg" role="group" aria-label="Tamaño del cartón">
    <button data-size="3">3×3</button><button data-size="4">4×4</button><button data-size="5">5×5</button>
   </div>
   <div class="seg" role="group" aria-label="Tipo de cartón">
    <button data-type="serie">De serie</button><button data-type="mine">Personalizado</button>
   </div>
  </div>

  <section class="card" aria-label="Tu cartón">
   <div class="chead">
    <div><span class="who" id="who">Tu cartón</span><span class="table">Partida <b id="codeTop"></b></span></div>
    <span id="clock" aria-label="Tiempo de partida">0:00</span>
   </div>
   <div class="grid" id="grid"></div>
  </section>

  <div class="score">
   <div><b id="sMarks">0/0</b><span>tachadas</span></div>
   <div><b id="sLines">0</b><span>líneas</span></div>
   <div><b id="sLeft">0</b><span>para bingo</span></div>
  </div>
  <div class="meter" aria-hidden="true"><i id="meter"></i></div>
  <div class="bar" style="margin-top:16px"><button class="btn ghost" id="limpiar" hidden>Limpiar cartón</button><button class="btn hi" id="nuevo">Partida nueva</button></div>

  <section class="panel" id="playPanel">
   <h2 id="playT"></h2>
   <p id="playP"></p>
   <label class="lbl" for="name">Tu nombre <span>(opcional)</span></label>
   <div class="row">
    <input id="name" maxlength="24" placeholder="Por ejemplo, Lucía" autocomplete="given-name">
    <button class="btn" id="nameBtn">Dame mi cartón</button>
   </div>
   <div class="tablecode"><span>Código de la partida</span><b id="code">----</b></div>
   <div class="row"><button class="btn" id="link">Compartir enlace</button><button class="btn ghost" id="copy">Copiar código</button></div>
   <div class="row" style="margin-top:12px">
    <input id="join" class="up" maxlength="6" placeholder="Código, p. ej. KQ7M-4" aria-label="Código de partida" autocomplete="off">
    <button class="btn ghost" id="joinBtn">Unirme</button>
   </div>
   <p class="msg" id="msg" role="status"></p>
  </section>

  <section class="panel" id="customPanel">
   <h2 id="customT"></h2>
   <p id="customP"></p>
   <textarea id="custom" aria-label="Tus casillas, una por línea"></textarea>
   <p class="hint" id="customInfo"></p>
   <div class="row"><button class="btn" id="makeCustom">Crear mi cartón</button></div>
   <p class="msg" id="customMsg" role="status"></p>
  </section>

  <section class="panel">
   <h2>Cómo se juega</h2>
   <ol id="rules"></ol>
  </section>

  <p class="foot"><button class="linkish" id="back2">Elegir otro juego</button></p>
 </main>
</div>

<div class="toast" id="toast" role="status">¡Línea!</div>
<div class="win-ov" id="winOv" role="dialog" aria-modal="true" aria-labelledby="winT">
 <div class="win-card">
  <svg class="win-star" aria-hidden="true"><use href="#i-star"/></svg>
  <h2 id="winT">¡BINGO!</h2>
  <p id="winP"></p>
  <div class="row" style="justify-content:center">
   <button class="btn ghost" id="again">Otro cartón</button>
   <button class="btn" id="close">Ver cartón</button>
  </div>
 </div>
</div>
<canvas id="fx"></canvas>

<!-- Al cambiar app.js, modes.js o styles.css, sube el ?v= aquí y la versión en sw.js -->
<script src="modes.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
